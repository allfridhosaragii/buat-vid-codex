name: Render FlowGuard V2

on:
  workflow_dispatch:
    inputs:
      render_target:
        description: Render target
        required: true
        default: proof
        type: choice
        options: [proof, draft, final]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: remotion-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: remotion-project/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate licensed CPU narration and sound design
        run: npm run tts:setup && npm run tts:generate
      - name: Validate source and timeline
        run: npm test
      - name: Render selected artifact
        run: npm run render:${{ inputs.render_target }}
      - name: Master audio
        run: npm run master:${{ inputs.render_target }}
      - name: Probe media
        run: ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -show_entries format=duration,size -of json out/*_MASTERED.mp4 | tee out/ffprobe.json
      - name: Upload render and probe
        uses: actions/upload-artifact@v4
        with:
          name: flowguard-v2-${{ inputs.render_target }}
          path: |
            remotion-project/out/*.mp4
            remotion-project/out/ffprobe.json
          if-no-files-found: error
          retention-days: 14
